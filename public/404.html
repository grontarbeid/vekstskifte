<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fant ikke siden – Vekstskiftehjelpen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonter/fonter.css">
<style>
:root { --bg: #eef2ea; --ink: #13221a; --muted: #4f5e53; --accent: #23603a; --accent-ink: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1610; --ink: #e8efe6; --muted: #a9b8aa; --accent: #8fcb75; --accent-ink: #0d2214; }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Schibsted Grotesk", system-ui, sans-serif; line-height: 1.6; padding: 24px 16px; }
main { max-width: 34rem; display: flex; flex-direction: column; gap: 14px; }
.e { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; margin: 0; }
p { margin: 0; color: var(--muted); }
a.knapp { align-self: flex-start; margin-top: 6px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <span class="e">Feil 404</span>
  <h1>Fant ikke siden</h1>
  <p>Adressen finnes ikke på vekstskifte.no. Kanskje lenken er skrevet feil, eller siden er flyttet.</p>
  <a class="knapp" href="/">Til Vekstskiftehjelpen</a>
</main>
</body>
</html>
